modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Jus144tice/mall-room-builder/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "mallroombuilder.png"
displayURL = "https://github.com/Jus144tice/mall-room-builder"
description = '''
Client-side carver for "mall" rooms and the spine hallway that joins them.

Stand facing the way you want to build; the block directly in front of you is where the job starts.

  * /mallroom room  -- a 5x5x5 room off the spine, open along its whole hallway-facing side,
    plus a 1-block recess behind each of its five faces to hold the decorative course.
    The corner cells, never visible from inside, are left exactly as found: the "framing".
  * /mallroom spine -- the next corridor segment, 7 long by 3 wide by 7 tall.
  * Add 'rough' to cut only the finished volume and come back for the recesses later.

It carves and nothing else. Decorating is up to you; the only block it ever places is a
cobblestone backfill into framing that gravel or a mob has knocked out.

Mining goes through the vanilla client mining path, so blocks break progressively, your own
pickaxes take the wear, and you keep every drop. Reach is checked more tightly than the server
checks it, so it never reaches further than you can.

WARNING: this mod initiates mining and steers player movement without input. It sends only
vanilla packets, but anti-cheat plugins will flag it. Intended for singleplayer and private
servers. Any key, mouse button, or mouse movement immediately aborts the job.

Client-only. Does not need to be installed on the server.
'''

# --- Dependencies -----------------------------------------------------------
# No mixins: auto-walk uses NeoForge's MovementInputUpdateEvent, and mining/placing are direct
# public calls on MultiPlayerGameMode. Nothing here is mapping-fragile at load time.
[[dependencies.mallroombuilder]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.mallroombuilder]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
