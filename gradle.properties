org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled because some ModDevGradle run tasks are not yet
# fully configuration-cache compatible on all setups. Re-enable if your build supports it.
org.gradle.configuration-cache=false

# Parchment human-readable parameter mappings (overlay on official Mojang mappings).
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge versions for Minecraft 1.21.1.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.233
neo_version_range=[21.1.0,)
loader_version_range=[1,)

# Mod metadata.
mod_id=mallroombuilder
mod_name=Mall Room Builder
mod_license=Apache-2.0
mod_version=0.7.0
mod_group_id=com.jus144tice.mallroombuilder
mod_authors=Jus144tice
mod_description=Client-side carver for "mall" rooms and the spine hallway that joins them. Stand facing the way you want to build and the block in front of you is where it starts: /mallroom room cuts a 5x5x5 room plus its five 1-block face recesses, leaving the never-visible corner framing standing; /mallroom spine cuts the next corridor segment, 7 long by 3 wide by 7 tall. Add 'rough' to skip the recesses and come back for them later. Mines through the vanilla path with your own tools so you keep every drop. Nothing is placed -- decorating is up to you.
